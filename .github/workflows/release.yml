name: Release

# Triggers on `v*` tags. Builds the Wails desktop binary for darwin/arm64,
# windows/amd64, and linux/amd64; bundles each into the
# platform-native installer (.dmg / NSIS .exe / .deb + .rpm); attaches them
# to a GitHub Release.
#
# Codesign + notarize are gated by repo secrets:
#   APPLE_DEVELOPER_ID                    "Developer ID Application: Your Name (TEAMID)"
#   APPLE_DEVELOPER_ID_CERT_P12           base64-encoded .p12 of the cert
#   APPLE_DEVELOPER_ID_CERT_PASSWORD      password for the .p12
#   APPLE_NOTARY_KEYCHAIN_PROFILE         name of the notarytool profile
#                                         (or use APPLE_ID/TEAM_ID/APP_PASSWORD trio)
#   APPLE_ID / APPLE_TEAM_ID /
#     APPLE_APP_SPECIFIC_PASSWORD         alternate notary auth
#
# When secrets are absent the workflow ad-hoc-signs and skips notarization
# so the release still ships (Gatekeeper will warn but allow open via
# right-click → Open). This makes the workflow useful for early RCs without
# blocking on Apple credentials.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.4.0-rc.1) — validated against the source metadata'
        required: true
      publish:
        description: 'Publish the existing tag after packaging (false runs packaging preflight only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    env:
      HAS_DEV_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 != '' }}
      HAS_NOTARY_CREDS: ${{ secrets.APPLE_NOTARY_KEYCHAIN_PROFILE != '' || secrets.APPLE_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: darwin-arm64
            arch: arm64
          - os: windows-latest
            label: windows-amd64
            arch: amd64
          - os: ubuntu-latest
            label: linux-amd64
            arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish && inputs.tag || github.sha) || github.ref }}

      - name: Record packaged source identity
        shell: bash
        run: printf 'VITE_APP_BUILD=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 scripts/check-release-version.py --expected-tag "$RELEASE_TAG"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: apps/engine-native/go.sum

      - name: Gate mandatory standalone conformance resources
        working-directory: apps/engine-native
        run: |
          python3 ../../scripts/build-offline-assets.py --check
          go run ./cmd/archscope-engine offline fixtures

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate macOS signing inputs
        if: startsWith(matrix.label, 'darwin-')
        env:
          DEV_ID_PRESENT: ${{ secrets.APPLE_DEVELOPER_ID != '' }}
          CERT_P12_PRESENT: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 != '' }}
          CERT_PASSWORD_PRESENT: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD != '' }}
          KEYCHAIN_PROFILE_PRESENT: ${{ secrets.APPLE_NOTARY_KEYCHAIN_PROFILE != '' }}
          APPLE_ID_PRESENT: ${{ secrets.APPLE_ID != '' }}
          APPLE_TEAM_ID_PRESENT: ${{ secrets.APPLE_TEAM_ID != '' }}
          APPLE_PASSWORD_PRESENT: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          set -euo pipefail

          if [ "$DEV_ID_PRESENT" = "true" ] || [ "$CERT_P12_PRESENT" = "true" ] || [ "$CERT_PASSWORD_PRESENT" = "true" ]; then
            if [ "$DEV_ID_PRESENT" != "true" ] || [ "$CERT_P12_PRESENT" != "true" ] || [ "$CERT_PASSWORD_PRESENT" != "true" ]; then
              echo "::error::macOS Developer ID signing requires APPLE_DEVELOPER_ID, APPLE_DEVELOPER_ID_CERT_P12, and APPLE_DEVELOPER_ID_CERT_PASSWORD together."
              exit 1
            fi
          fi

          if [ "$APPLE_ID_PRESENT" = "true" ] || [ "$APPLE_TEAM_ID_PRESENT" = "true" ] || [ "$APPLE_PASSWORD_PRESENT" = "true" ]; then
            if [ "$APPLE_ID_PRESENT" != "true" ] || [ "$APPLE_TEAM_ID_PRESENT" != "true" ] || [ "$APPLE_PASSWORD_PRESENT" != "true" ]; then
              echo "::error::Apple ID notarization requires APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_SPECIFIC_PASSWORD together."
              exit 1
            fi
          fi

          if [ "$KEYCHAIN_PROFILE_PRESENT" = "true" ] || [ "$APPLE_ID_PRESENT" = "true" ]; then
            if [ "$DEV_ID_PRESENT" != "true" ]; then
              echo "::error::Notarization credentials were provided, but Developer ID signing secrets are incomplete."
              exit 1
            fi
          fi

          if [ "$DEV_ID_PRESENT" = "true" ]; then
            echo "macOS Developer ID signing secrets are configured."
          else
            echo "macOS Developer ID signing secrets are absent; release will use ad-hoc signing and skip notarization."
          fi

      - name: Linux WebKitGTK runtime headers
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install Task runner (macOS / Linux)
        if: matrix.os != 'windows-latest'
        run: |
          curl -sL https://taskfile.dev/install.sh | sh -s -- -d -b /usr/local/bin

      - name: Install Task runner and Windows packaging tools
        if: matrix.os == 'windows-latest'
        run: |
          choco install go-task nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Frontend deps
        run: npm ci
        working-directory: apps/engine-native/cmd/archscope-app/frontend

      - name: Frontend state regression
        run: npm run test:state
        working-directory: apps/engine-native/cmd/archscope-app/frontend

      - name: Wails package
        if: matrix.os != 'ubuntu-latest'
        run: task package ARCH=${{ matrix.arch }}
        working-directory: apps/engine-native/cmd/archscope-app

      - name: Linux release packages
        if: matrix.os == 'ubuntu-latest'
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          export GIT_COMMITTER_NAME="$(git log -1 --format=%cn)"
          export GIT_COMMITTER_EMAIL="$(git log -1 --format=%ce)"
          task linux:create:deb linux:create:rpm ARCH=${{ matrix.arch }}
        working-directory: apps/engine-native/cmd/archscope-app

      - name: Verify Windows version resources and installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: apps/engine-native/cmd/archscope-app
        run: |
          $ErrorActionPreference = "Stop"
          $release = Get-Content build/release.json | ConvertFrom-Json
          $binaries = @(Get-Item bin/archscope.exe) + @(Get-ChildItem bin/*installer*.exe)
          if ($binaries.Count -lt 2) { throw "Windows installer missing" }
          foreach ($file in $binaries) {
            $info = $file.VersionInfo
            $numeric = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart).$($info.FilePrivatePart)"
            if ($numeric -ne $release.windowsVersion -or $info.ProductVersion -ne $release.version) {
              throw "Release version mismatch in $($file.Name)"
            }
          }

      # ── macOS: codesign with Developer ID if cert is in repo secrets ──
      - name: Import Developer ID certificate (macOS)
        if: startsWith(matrix.label, 'darwin-') && env.HAS_DEV_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12

      - name: Codesign (Developer ID)
        if: startsWith(matrix.label, 'darwin-')
        env:
          DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          if [ -n "${DEVELOPER_ID:-}" ]; then
            task darwin:codesign:developer
          else
            echo "APPLE_DEVELOPER_ID secret not set; keeping ad-hoc signature."
          fi
        working-directory: apps/engine-native/cmd/archscope-app

      - name: Notarize
        if: startsWith(matrix.label, 'darwin-')
        env:
          KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARY_KEYCHAIN_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "${KEYCHAIN_PROFILE:-}" ] || [ -n "${APPLE_ID:-}" ]; then
            task darwin:notarize
          else
            echo "Notary credentials absent; skipping notarization."
          fi
        working-directory: apps/engine-native/cmd/archscope-app

      - name: Verify macOS signature and notarization
        if: startsWith(matrix.label, 'darwin-')
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 bin/archscope.app
          python3 ../../../../scripts/check-release-version.py --bundle bin/archscope.app
          if [ "$HAS_NOTARY_CREDS" = "true" ]; then
            xcrun stapler validate bin/archscope.app
          else
            echo "Notarization credentials absent; skipping stapler validation."
          fi
        working-directory: apps/engine-native/cmd/archscope-app

      - name: Build DMG
        if: startsWith(matrix.label, 'darwin-')
        run: task darwin:package:dmg ARCH=${{ matrix.arch }}
        working-directory: apps/engine-native/cmd/archscope-app

      - name: Archive macOS app with permissions and symlinks
        if: startsWith(matrix.label, 'darwin-')
        run: ditto -c -k --keepParent bin/archscope.app bin/archscope-${{ matrix.label }}.zip
        working-directory: apps/engine-native/cmd/archscope-app

      - name: Archive Linux executable with permissions
        if: matrix.os == 'ubuntu-latest'
        run: tar -czf bin/archscope-${{ matrix.label }}.tar.gz -C bin archscope
        working-directory: apps/engine-native/cmd/archscope-app

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: archscope-${{ matrix.label }}
          path: |
            apps/engine-native/cmd/archscope-app/bin/*.zip
            apps/engine-native/cmd/archscope-app/bin/*.tar.gz
            apps/engine-native/cmd/archscope-app/bin/*.dmg
            apps/engine-native/cmd/archscope-app/bin/*.exe
            apps/engine-native/cmd/archscope-app/bin/*.deb
            apps/engine-native/cmd/archscope-app/bin/*.rpm
          if-no-files-found: error

  release:
    name: Verify release assets and publish
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish && inputs.tag || github.sha) || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Pack per-platform archives
        run: |
          set -euo pipefail
          OUT=release-files
          mkdir -p "$OUT"
          # Preserve archives made on the native runner: artifact transfer strips modes.
          for arch in arm64 amd64; do
            DIR="artifacts/archscope-darwin-${arch}"
            if [ -d "$DIR" ]; then
              if ls "$DIR"/*.dmg >/dev/null 2>&1; then
                cp "$DIR"/*.dmg "$OUT/" || true
              fi
              cp "$DIR/archscope-darwin-${arch}.zip" "$OUT/"
            fi
          done
          # Windows: zip exe / nsis output
          if [ -d "artifacts/archscope-windows-amd64" ]; then
            ( cd artifacts/archscope-windows-amd64 && zip -qr "../../$OUT/archscope-windows-amd64.zip" . )
          fi
          # Linux: ship .deb + .rpm individually + tar.gz of the raw binary
          DIR="artifacts/archscope-linux-amd64"
          if [ -d "$DIR" ]; then
            cp "$DIR/archscope-linux-amd64.tar.gz" "$OUT/"
            for f in "$DIR"/*.deb "$DIR"/*.rpm; do
              [ -f "$f" ] && cp "$f" "$OUT/" || true
            done
          fi
          # Required standalone corpus; missing files fail release assembly.
          cp apps/engine-native/internal/distribution/assets/fixtures.zip "$OUT/archscope-conformance-v1.zip"
          git archive --format=zip --output="$OUT/archscope-docs.zip" HEAD docs/en docs/ko examples
          cp "docs/en/releases/$RELEASE_TAG.md" "$OUT/RELEASE_NOTES.en.md"
          cp "docs/ko/releases/$RELEASE_TAG.md" "$OUT/RELEASE_NOTES.ko.md"
          test -s "$OUT/archscope-darwin-arm64.zip"
          test -s "$OUT/archscope-windows-amd64.zip"
          test -s "$OUT/archscope-linux-amd64.tar.gz"
          ls "$OUT"/*.dmg "$OUT"/*.deb "$OUT"/*.rpm >/dev/null
          ls -lh "$OUT"

      - name: Verify archived executable permissions
        shell: python
        run: |
          import tarfile, zipfile
          from pathlib import Path
          root = Path("release-files")
          with zipfile.ZipFile(root / "archscope-darwin-arm64.zip") as archive:
              assert archive.testzip() is None, "macOS archive CRC failure"
              binary = archive.getinfo("archscope.app/Contents/MacOS/archscope")
              assert (binary.external_attr >> 16) & 0o111, "macOS executable mode lost"
          with tarfile.open(root / "archscope-linux-amd64.tar.gz") as archive:
              binary = archive.getmember("archscope")
              assert binary.isfile() and binary.mode & 0o111, "Linux executable mode lost"

      - name: Compute checksums
        run: |
          cd release-files
          sha256sum * > SHA256SUMS

      - name: Resolve tag name
        id: tag
        run: printf 'name=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Preserve assembled preflight assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-assets
          path: release-files/*
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'push' || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: docs/en/releases/${{ env.RELEASE_TAG }}.md
          generate_release_notes: false
          make_latest: ${{ contains(steps.tag.outputs.name, '-') && 'false' || 'true' }}
          prerelease: ${{ contains(steps.tag.outputs.name, '-rc') || contains(steps.tag.outputs.name, '-alpha') || contains(steps.tag.outputs.name, '-beta') }}
          draft: false
          files: |
            release-files/*
