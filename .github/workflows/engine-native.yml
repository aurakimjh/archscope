name: Engine Native (Go + Wails)

on:
  pull_request:
    paths:
      - ".gitattributes"
      - "apps/engine-native/**"
      - "examples/**"
      - "scripts/verify-desktop-only.mjs"
      - "scripts/verify-windows-desktop-soak.mjs"
      - "scripts/lib/desktop-soak-checks.mjs"
      - "scripts/test-desktop-soak-checks.mjs"
      - "scripts/verify-offline-syscalls.py"
      - "scripts/offline-observer.Dockerfile"
      - ".github/workflows/engine-native.yml"
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - "apps/engine-native/**"
      - "examples/**"
      - "scripts/verify-desktop-only.mjs"
      - "scripts/verify-windows-desktop-soak.mjs"
      - "scripts/lib/desktop-soak-checks.mjs"
      - "scripts/test-desktop-soak-checks.mjs"
      - "scripts/verify-offline-syscalls.py"
      - "scripts/offline-observer.Dockerfile"
      - ".github/workflows/engine-native.yml"

defaults:
  run:
    working-directory: apps/engine-native

jobs:
  offline-regression:
    name: Linux disconnected CLI and architecture gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/engine-native/go.sum
      - name: Enforce production import boundaries and converter policy
        run: go test ./internal/architecture ./internal/distribution -count=1
      - name: Build standalone Linux engine
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o "${RUNNER_TEMP}/archscope-offline-engine" ./cmd/archscope-engine
      - name: Prepare observer before disconnecting
        working-directory: .
        run: docker build -f scripts/offline-observer.Dockerfile -t archscope-offline-observer .
      - name: Observe clean install without network and detect failed-connect control
        working-directory: .
        run: python3 scripts/verify-offline-syscalls.py --engine "${RUNNER_TEMP}/archscope-offline-engine" --image archscope-offline-observer --out "${RUNNER_TEMP}/offline-syscalls"
      - name: Upload bounded offline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-offline-syscalls
          path: ${{ runner.temp }}/offline-syscalls
          if-no-files-found: error

  windows-cross:
    name: Windows GUI cross-build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [386, amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/engine-native/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Frontend production assets
        working-directory: apps/engine-native/cmd/archscope-app/frontend
        run: npm ci && npm run build
      - name: Build Windows GUI executable
        working-directory: apps/engine-native/cmd/archscope-app
        env:
          GOARCH: ${{ matrix.arch }}
        run: node build/windows/build.mjs -tags production -trimpath -ldflags "-H windowsgui" -o "${{ runner.temp }}/archscope-${{ matrix.arch }}.exe" .

  windows-x86:
    name: Native Windows tests (386)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOARCH: '386'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/engine-native/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify native x86 packages
        run: go vet ./...
      - name: Test native x86 packages with the production SDK fixes
        run: node cmd/archscope-app/build/windows/test.mjs -count=1 -timeout 10m ./...

  go:
    name: Go test/build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: apps/engine-native/go.sum

      - name: Set up Node for desktop policy checks
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Linux WebKitGTK headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: go vet
        run: go vet ./...

      - name: Enforce desktop-only product targets
        run: node ../../scripts/verify-desktop-only.mjs --check-server-build

      - name: go build
        run: go build ./cmd/archscope-engine ./cmd/archscope-app

      - name: Mandatory offline resource parity and fixture gate
        run: |
          python3 ../../scripts/build-offline-assets.py --check
          go run ./cmd/archscope-engine offline fixtures

      - name: go test
        # The analysis package includes cumulative scale/import/export cases;
        # race instrumentation can exceed Go's default ten-minute package limit.
        # Bound concurrent packages so large fixtures do not starve each other.
        run: go test ./... -race -count=1 -p 2 -timeout 20m

      - name: Windows live-capture E2E
        if: runner.os == 'Windows'
        run: go test -count=1 ./cmd/archscope-app -run '^TestWindowsLiveCaptureE2E$'

      - name: Windows resolver-cost measurement
        if: runner.os == 'Windows'
        env:
          ARCHSCOPE_RUN_RESOLVER_PERF: "1"
          ARCHSCOPE_RESOLVER_PERF_OUT: ${{ runner.temp }}\archscope-resolver-cost.json
        run: go test -count=1 -v ./internal/capture/procmap -run '^TestWindowsResolverCostMeasurement$'

      - name: Upload Windows resolver-cost evidence
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: r-rg1-windows-resolver-cost
          path: ${{ runner.temp }}\archscope-resolver-cost.json
          if-no-files-found: error

      # SEC-10 acceptance. The preflight's policy read is not evidence on its
      # own, so this crashes a process holding plaintext and inspects the OS
      # artifacts. It runs from the repository root because the script resolves
      # the engine directory itself.
      - name: Native registry policy rename regression
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: ./scripts/test-windows-policy-registry.ps1

      - name: Prepare SEC-10 crash-dump policy
        id: sec10_policy
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          ./scripts/set-sec10-ci-dump-policy.ps1 `
            -Action Prepare `
            -StatePath "${{ runner.temp }}\sec10-ci-policy-state.json"

      - name: Windows request and response body capture E2E
        if: runner.os == 'Windows'
        env:
          ARCHSCOPE_RUN_BODY_E2E: "1"
        run: go test -count=1 -v ./cmd/archscope-app -run '^TestWindowsBodyCaptureE2E$'

      - name: SEC-10 crash-dump exclusion evidence
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          ./scripts/verify-sec10-dump-exclusion.ps1 `
            -EvidenceOut "${{ runner.temp }}\sec10-dump-exclusion-evidence.json"

      - name: Restore SEC-10 crash-dump policy
        if: runner.os == 'Windows' && always() && steps.sec10_policy.outcome != 'skipped'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          ./scripts/set-sec10-ci-dump-policy.ps1 `
            -Action Restore `
            -StatePath "${{ runner.temp }}\sec10-ci-policy-state.json"

      - name: Upload SEC-10 dump-exclusion evidence
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: t588-sec10-dump-exclusion
          path: |
            ${{ runner.temp }}\sec10-dump-exclusion-evidence.json
            ${{ runner.temp }}\sec10-dump-exclusion-evidence.json.sha256
          if-no-files-found: error

  wails-frontend:
    name: Wails frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine-native/cmd/archscope-app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/engine-native/cmd/archscope-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: State tests
        run: npm run test:state

      - name: Desktop soak failure predicates
        working-directory: .
        run: node --test scripts/test-desktop-soak-checks.mjs

      - name: Build
        run: npm run build

  macos-release-smoke:
    name: macOS offline import/package smoke
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: apps/engine-native/go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/engine-native/cmd/archscope-app/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install Task runner
        run: curl -sL https://taskfile.dev/install.sh | sh -s -- -d -b /usr/local/bin

      - name: Install frontend dependencies
        working-directory: apps/engine-native/cmd/archscope-app/frontend
        run: npm ci

      - name: Build engine CLI
        working-directory: apps/engine-native
        run: go build -o "${RUNNER_TEMP}/archscope-engine" ./cmd/archscope-engine

      - name: Offline import smoke
        run: |
          "${RUNNER_TEMP}/archscope-engine" access-log analyze \
            --in examples/access-logs/sample-nginx-access.log \
            --out "${RUNNER_TEMP}/access-log-result.json"
          "${RUNNER_TEMP}/archscope-engine" browser import \
            --in apps/engine-native/internal/parsers/lighthouse/testdata/populated_report.json \
            --format lighthouse-json \
            --out "${RUNNER_TEMP}/lighthouse-result.json"
          jq -e '.type == "access_log" and (.tables.sample_records | length > 0)' \
            "${RUNNER_TEMP}/access-log-result.json"
          jq -e '.type == "browser_audit_evidence" and (.tables.audits | length > 0)' \
            "${RUNNER_TEMP}/lighthouse-result.json"

      - name: Package macOS app
        working-directory: apps/engine-native/cmd/archscope-app
        run: task package

      - name: Verify package
        run: |
          test -x apps/engine-native/cmd/archscope-app/bin/archscope.app/Contents/MacOS/archscope
          codesign --verify --deep --strict apps/engine-native/cmd/archscope-app/bin/archscope.app
