# This file contains the configuration for this project.
# Update desktop platform metadata alongside `info`. Review SDK template updates
# in a temporary project; regenerating all assets restores unsupported targets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "ArchScope"
  productName: "ArchScope"
  productIdentifier: "com.archscope.app"
  description: "Local-first architecture diagnostics desktop"
  copyright: "Copyright (c) 2026 ArchScope contributors."
  comments: "Wails v3 desktop app"
  version: "0.3.5.28"
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
