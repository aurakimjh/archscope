<!doctype html><html lang="ko"><meta charset="utf-8"><title>T-636 renderer check</title><style>body{font:16px sans-serif;background:#f1f5f9}img{width:100%;max-width:1600px;background:white}</style><h1>T-636 fixed renderer</h1><p>Actual visualRaster.ts, synthetic frozen input; no native WebView claim.</p><button id="render">Render synthetic view</button><p id="status">Ready</p><a id="download" download="browser.png" hidden>Download PNG</a><img id="preview"><script type="module">
import {rasterizeVisual} from '/src/state/visualRaster.ts';
let input=await (await fetch('./'+(new URLSearchParams(location.search).get('case')||'input')+'.json')).json();
window.renderCase=async()=>{document.querySelector('#status').textContent='Rendering';await rasterizeVisual(input,async(page,png)=>{window.png=png;window.pngs??=[];window.pngs[page]=png;const bytes=Uint8Array.from(atob(png.split(',')[1]),c=>c.charCodeAt(0));window.digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),n=>n.toString(16).padStart(2,'0')).join('');document.querySelector('#preview').src=png;document.querySelector('#download').href=png;document.querySelector('#download').hidden=false;});document.querySelector('#status').textContent='Rendered '+input.width+'x'+input.height+' SHA256 '+window.digest;return window.digest;};
